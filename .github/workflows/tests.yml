name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Voluptuous for actual configuration schema validation
        run: python -m pip install "voluptuous>=0.14,<1"
      - name: Test the FinTS and Hanseatic flows and configuration schemas
        run: python -m unittest discover -s tests -v
